name: Atualizar estatísticas

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia às 06:17 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/gerar_stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gerar_stats.py "${{ github.repository_owner }}"

      - name: Salvar se mudou
        run: |
          if git diff --quiet -- assets/stats.svg; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: atualiza estatísticas do perfil"
          git push
